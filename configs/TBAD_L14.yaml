CACHE_DIR: 'cache'
OUTPUT: 'output_test_tip.csv'

DATA:
    ROOT: '/root/autodl-tmp/TBAD_Dataset/'
    TRAIN_FILE: 'dataset/TBAD/train_files/'
    TEST_FILE: 'dataset/TBAD/test_files/'
    VAL_FILE: 'dataset/TBAD/val_files/'
    TIP_FILE: 'dataset/TBAD/tip_files/'
    DATASET: TBAD-8
    NUM_FRAMES: 16
    NUM_CLASSES: 8
    CLASS_NAMES: 'dataset/TBAD/class_names.json'
    SHOTS: 0
MODEL:
    ARCH: ViT-B/16
    YOLO: 'Yolo-model/yolov8n.pt'
    IF_TEACHER: 0
    ZS: 0
    LABEL_SMOOTH: 1
    TEMPORAL_POOLING: 'attention'
    LP: 1
    USE_DISTILLATION: 1
    PROMPT: 1
TRAIN:
    BATCH_SIZE: 1 # BS 64
    ACCUMULATION_STEPS: 2
    EPOCHS: 100
    LR: 0.001
TEXT_PROMPT:
    N_CTX_PRE: 8
    CTX_PRE_INIT: "x x x x x x x x"
    N_CTX_POST: 3
    CTX_POST_INIT: "x x x"
TIP_ADAPTER:
    USE_TIP_ADAPTER: 1
    INIT_ALPHA: 1
    INIT_BETA: 1
  # if loading cached kv
    LOAD_CACHE: 1

    AUG_EPOCH: 10
    TRAIN_EPOCH: 1

    SEARCH_HP: True
    SEARCH_SCALE: [12, 5]
    SEARCH_STEP: [200, 20]