CACHE_DIR: 'cache'
OUTPUT: 'output_test_tip.csv'

DATA:
    ROOT: '/root/autodl-tmp/TBAD_Dataset/'
    TRAIN_FILE: 'dataset/TBAD/train_files/'
    TEST_FILE: 'dataset/TBAD/test_files/'
    VAL_FILE: 'dataset/TBAD/val_files/'
    TIP_FILE: 'dataset/TBAD/tip_files/'
    DATASET: TBAD-8
    NUM_FRAMES: 16
    NUM_CLASSES: 8
    CLASS_NAMES: 'dataset/TBAD/class_names.json'
    SHOTS: 8
    PRELOAD_CACHE_DIR: 'cache/preload_feat'
MODEL:
    ARCH: ViT-L/14@336px # ViT-B/16
    YOLO: 'Yolo-model/yolov8n.pt'
    IF_TEACHER: 0
    ZS: 0
    LABEL_SMOOTH: 1
    TEMPORAL_POOLING: 'attention'
    LP: 1
    USE_DISTILLATION: 1
    PROMPT: 1
TRAIN:
    BATCH_SIZE: 2 # BS 64
    ACCUMULATION_STEPS: 2
    EPOCHS: 21
    LR: 0.0001
TEXT_PROMPT:
    N_CTX_PRE: 8
    CTX_PRE_INIT: "x x x x x x x x"
    N_CTX_POST: 3
    CTX_POST_INIT: "x x x"
TIP_ADAPTER:
    USE_TIP_ADAPTER: 1
    INIT_ALPHA: 1
    INIT_BETA: 5
  # if loading cached kv
    LOAD_CACHE: 1

    AUG_EPOCH: 30
    TRAIN_EPOCH: 10

    SEARCH_HP: True
    SEARCH_SCALE: [12, 5]
    SEARCH_STEP: [200, 20]